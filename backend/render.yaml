services:
  - type: web
    name: jadota-backend
    runtime: python
    repo: https://github.com/amos-ugbedah/jadota-ai
    plan: free
    region: oregon
    buildCommand: |
      cd backend
      pip install -r requirements/base.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jadota-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true